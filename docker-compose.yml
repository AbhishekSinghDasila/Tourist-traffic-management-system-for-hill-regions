
services:

  # ---------------- Postgres ----------------
  postgres:
    image: postgres:16-alpine
    container_name: devbhumi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      TRAFFIC_DB_PASSWORD: ${TRAFFIC_DB_PASSWORD}
      COMPLAINT_DB_PASSWORD: ${COMPLAINT_DB_PASSWORD}
      ALERT_DB_PASSWORD: ${ALERT_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seeds/init_db_users.sh:/docker-entrypoint-initdb.d/01_init_db_users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devbhumi-net

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    container_name: devbhumi-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devbhumi-net

  # ---------------- Zookeeper (Kafka dependency) ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: devbhumi-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - devbhumi-net

  # ---------------- Kafka ----------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: devbhumi-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - devbhumi-net

  # ---------------- MinIO (local S3-compatible storage for complaint images) ----------------
  minio:
    build:
      context: ./deploy/minio
      target: server
    container_name: devbhumi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devbhumi-net

  # One-shot: creates the complaint-media bucket if it doesn't exist yet,
  # then exits. MinIO does not auto-create buckets on startup.
  minio-init:
    build:
      context: ./deploy/minio
      target: client
    container_name: devbhumi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET_NAME
      "
    networks:
      - devbhumi-net

  # ---------------- Auth Service ----------------
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: devbhumi-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${AUTH_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      JWT_ISSUER: ${JWT_ISSUER}
    secrets:
      - jwt_private_key
      - jwt_public_key
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - devbhumi-net

  # ---------------- Traffic Service ----------------
  traffic-service:
    build:
      context: ./services/traffic-service
      dockerfile: Dockerfile
    container_name: devbhumi-traffic-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${TRAFFIC_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
    secrets:
      - jwt_public_key
    ports:
      - "127.0.0.1:${TRAFFIC_SERVICE_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - devbhumi-net

  # ---------------- Complaint Service ----------------
  complaint-service:
    build:
      context: ./services/complaint-service
      dockerfile: Dockerfile
    container_name: devbhumi-complaint-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${COMPLAINT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      USE_OCR: ${USE_OCR}
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    secrets:
      - jwt_public_key
    ports:
      - "127.0.0.1:${COMPLAINT_SERVICE_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - devbhumi-net

  # ---------------- Alert Service ----------------
  alert-service:
    build:
      context: ./services/alert-service
      dockerfile: Dockerfile
    container_name: devbhumi-alert-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${ALERT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      ALERT_RADIUS_KM: ${ALERT_RADIUS_KM:-2.0}
      USE_FCM: ${USE_FCM:-false}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    secrets:
      - jwt_public_key
    ports:
      - "127.0.0.1:${ALERT_SERVICE_PORT:-8004}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - devbhumi-net

  # ---------------- ML Service ----------------
  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    container_name: devbhumi-ml-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      MODEL_DIR: /app/model_artifacts
    ports:
      - "127.0.0.1:${ML_SERVICE_PORT:-8005}:8000"
    volumes:
      - ml_model_data:/app/model_artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - devbhumi-net

  # ---------------- Nginx (reverse proxy + rate limiting + static frontend) ----------------
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: devbhumi-nginx
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      traffic-service:
        condition: service_healthy
      complaint-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devbhumi-net

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem

networks:
  devbhumi-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ml_model_data:

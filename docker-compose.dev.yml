# DevBhumi — DEVELOPMENT compose (Week 1 to Week 5)

services:

  postgres:
    image: postgres:16-alpine
    container_name: devbhumi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seeds/init_db_users.sql:/docker-entrypoint-initdb.d/01_init_db_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devbhumi-net

  redis:
    image: redis:7-alpine
    container_name: devbhumi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devbhumi-net

  minio:
    image: minio/minio:latest
    container_name: devbhumi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devbhumi-net

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: devbhumi-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${AUTH_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
      JWT_ISSUER: ${JWT_ISSUER}
    secrets:
      - jwt_private_key
      - jwt_public_key
    ports:
      - "${AUTH_SERVICE_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - devbhumi-net

  traffic-service:
    build:
      context: ./services/traffic-service
      dockerfile: Dockerfile
    container_name: devbhumi-traffic-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${TRAFFIC_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
    secrets:
      - jwt_public_key
    ports:
      - "${TRAFFIC_SERVICE_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - devbhumi-net

  complaint-service:
    build:
      context: ./services/complaint-service
      dockerfile: Dockerfile
    container_name: devbhumi-complaint-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${COMPLAINT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      USE_OCR: ${USE_OCR}
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    secrets:
      - jwt_public_key
    ports:
      - "${COMPLAINT_SERVICE_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - devbhumi-net

  alert-service:
    build:
      context: ./services/alert-service
      dockerfile: Dockerfile
    container_name: devbhumi-alert-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${ALERT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ISSUER: ${JWT_ISSUER}
      ALERT_RADIUS_KM: ${ALERT_RADIUS_KM:-2.0}
      USE_FCM: ${USE_FCM:-false}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    secrets:
      - jwt_public_key
    ports:
      - "${ALERT_SERVICE_PORT:-8004}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - devbhumi-net

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem

networks:
  devbhumi-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ml_model_data:

  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    container_name: devbhumi-ml-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      MODEL_DIR: /app/model_artifacts
    ports:
      - "${ML_SERVICE_PORT:-8005}:8000"
    volumes:
      - ml_model_data:/app/model_artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - devbhumi-net

# ---------------- Upstreams ----------------
upstream auth_service      { server auth-service:8000; }
upstream traffic_service   { server traffic-service:8000; }
upstream complaint_service { server complaint-service:8000; }
upstream alert_service     { server alert-service:8000; }
upstream ml_service        { server ml-service:8000; }

server {
    listen 80;
    server_name _;

    # complaint-service enforces MAX_IMAGE_SIZE_BYTES (8MB) itself; this is
    # the hard edge limit referenced in that service's config comment.
    client_max_body_size 10m;

    # ---------------- Security headers ----------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    limit_conn conn_limit 20;

    # ---------------- Health check (used by the nginx container's own HEALTHCHECK) ----------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------------- Auth service ----------------
    # Tighter rate limit on the whole auth surface — it's the route an
    # attacker would hammer for credential stuffing.
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://auth_service;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ---------------- Traffic service ----------------
    location /api/v1/traffic/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://traffic_service;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ---------------- Complaint service ----------------
    # Anonymous public submission endpoint — rate limited harder than
    # general API traffic since it requires no auth.
    location /api/v1/complaints/ {
        limit_req zone=api_complaints burst=5 nodelay;
        proxy_pass http://complaint_service;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ---------------- Alert service ----------------
    location /api/v1/alerts/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://alert_service;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ---------------- ML service ----------------
    location /api/v1/predict/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://ml_service;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # ---------------- Frontend (React SPA, built by `npm run build`) ----------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

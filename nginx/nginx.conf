user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Hide upstream identifying headers
    proxy_hide_header X-Powered-By;
    server_tokens off;

    # ---------------- Rate limiting zones ----------------
    # General API traffic: 10 req/s per client IP, small burst allowed.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    # Auth endpoints (login/register): tighter, to slow down credential
    # stuffing / brute force without blocking normal usage.
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    # Anonymous complaint submission: public, unauthenticated, so it's the
    # most abuse-prone route — cap it harder than everything else.
    limit_req_zone $binary_remote_addr zone=api_complaints:10m rate=20r/m;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    include /etc/nginx/conf.d/*.conf;
}
